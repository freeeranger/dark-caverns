<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/dark-caverns/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Page not found | Dark Caverns</title>
    <meta name="description" content="The requested page does not exist on the Dark Caverns website." />
    <script>
      (function() {
        var path = window.location.pathname;
        var validDirs = ['guides', 'wiki', 'download', 'credits'];
        for (var i = 0; i < validDirs.length; i++) {
          if (path.endsWith('/' + validDirs[i])) {
            window.location.replace(path + '/' + window.location.search + window.location.hash);
            return;
          }
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@south-paw/typeface-minecraft@1.0.0/index.css" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      ::selection { background: #55ffaf; color: #0c1015; }
      body {
        margin: 0;
        background: #121316;
        color: #d6dae5;
        font-family: 'Rubik', system-ui, sans-serif;
        min-height: 100vh;
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      main {
        display: flex;
        min-height: calc(100vh - 48px);
        align-items: center;
        justify-content: center;
      }
      .mc-404-box {
        background: #17181c;
        border: 2px solid #000;
        box-shadow: inset 2px 2px 0 #2a2c34, inset -2px -2px 0 #0c0d0f;
        max-width: 560px;
        width: 100%;
        padding: clamp(24px, 6vw, 40px);
        text-align: center;
      }
      .mc-icon {
        display: grid;
        width: 52px;
        height: 52px;
        margin: 0 auto 20px;
        place-items: center;
        background: #1c1d22;
        border: 2px solid #000;
      }
      .mc-icon img { width: 34px; height: 34px; image-rendering: pixelated; }
      h1 {
        margin: 0 0 12px;
        font-family: 'Minecraft', monospace;
        font-size: clamp(24px, 7vw, 36px);
        line-height: 1.15;
        color: #ff7777;
        text-shadow: 2px 2px 0 #000;
      }
      p {
        max-width: 44ch;
        margin: 0 auto 28px;
        color: #aeb5c5;
        font-size: 14px;
        line-height: 1.65;
      }
      nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 8px 16px;
        color: #e2e4ec;
        background: #44464a;
        border-top: 2px solid #7e8187;
        border-left: 2px solid #7e8187;
        border-right: 2px solid #202124;
        border-bottom: 2px solid #202124;
        font-family: 'Minecraft', monospace;
        font-size: 14px;
        text-decoration: none;
        text-shadow: 2px 2px 0 #18191b;
        user-select: none;
      }
      a:hover { background: #55575c; color: #ffffa0; }
      a:focus-visible { outline: 2px solid #55ffaf; outline-offset: 3px; }
      .primary {
        color: #e2fff8;
        background: #0c433f;
        border-top-color: #00ddc0;
        border-left-color: #00ddc0;
        border-right-color: #05211f;
        border-bottom-color: #05211f;
        text-shadow: 2px 2px 0 #041716;
      }
      .primary:hover { background: #125953; color: #fff; }
      @media (max-width: 420px) {
        nav { display: grid; grid-template-columns: 1fr 1fr; }
        nav a:first-child { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="mc-404-box" aria-labelledby="missing-title">
        <div class="mc-icon" aria-hidden="true">
          <img src="/dark-caverns/favicon.png" alt="" />
        </div>
        <h1 id="missing-title">You fell out of the world!</h1>
        <p>There is no page at this address. Return home or use one of the links below.</p>
        <nav aria-label="Page recovery">
          <a href="/dark-caverns/" class="primary">Respawn at home</a>
          <a href="/dark-caverns/guides/">Guides</a>
          <a href="/dark-caverns/wiki/">Wiki</a>
          <a href="/dark-caverns/download/">Download</a>
        </nav>
      </section>
    </main>
  </body>
</html>
